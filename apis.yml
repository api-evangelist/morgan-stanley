name: Morgan Stanley
kind: company
description: >-
  Morgan Stanley is a global financial services firm that offers a wide range of services
  to individuals, corporations, and governments. The firm is known for its investment
  banking and wealth management services, helping clients raise capital, make strategic
  acquisitions, and manage their assets. Morgan Stanley also provides services in
  areas such as asset management, trading, research, and risk management. Its public
  developer surface is split between an invitation-only institutional API Platform at
  developer.morganstanley.com (OAuth 2.0 with certificate-based token exchange, REST and
  WebSocket, built to the OpenAPI Specification) and the genuinely public E*TRADE from
  Morgan Stanley brokerage API at developer.etrade.com (OAuth 1.0a, REST, with a sandbox).
