reviewer: API Evangelist
date: '2026-07-23'
slug: morgan-stanley
summary: >-
  Morgan Stanley runs two distinct public API surfaces. (1) An invitation-only
  INSTITUTIONAL API Platform at developer.morganstanley.com, and (2) the genuinely
  public E*TRADE from Morgan Stanley retail-brokerage API at developer.etrade.com.
  No first-party OpenAPI/Swagger specs are publicly downloadable, so this profile
  lists documented APIs humanURL/baseURL-only with no harvested specs.
developer_portals:
  - url: https://developer.morganstanley.com/
    status: 403 to anonymous crawlers; real portal, invitation/credential-gated
    posture: >-
      Institutional. Clients must contact a Morgan Stanley representative to be
      onboarded, then browse specs, try APIs interactively, and acquire keys. REST +
      WebSocket. Built to the OpenAPI Specification following Microsoft API Guidelines.
  - url: https://developer.etrade.com/
    status: 403 to anonymous crawlers; real public self-service portal
    posture: >-
      Public retail-brokerage developer platform (E*TRADE from Morgan Stanley).
      V1 REST with in-portal Swagger docs, a Python example app, and a full sandbox
      (apisb.etrade.com). Modules: Accounts, Market Data (quotes/option chains),
      Order (equity/option), Alerts.
auth_model:
  morgan_stanley_platform: >-
    OAuth 2.0 with strong certificate-based token exchange. Confidential client
    credentials against Microsoft Entra / Azure AD (client id, scopes, tenant,
    certificate thumbprint + self-signed private key) using the MSAL library.
  etrade: >-
    OAuth 1.0a (request token -> user authorization -> access token -> renew ->
    revoke), on behalf of an authenticated E*TRADE account holder.
spec_provenance: >-
  No downloadable OpenAPI/Swagger harvested. Morgan Stanley states its REST APIs are
  built to the OpenAPI Specification, but the OAS documents live behind the
  authenticated, invitation-only portal. E*TRADE publishes Swagger, but only inside
  its developer portal after registration. All apis[] entries are therefore
  humanURL/baseURL-only. E*TRADE base hosts (api.etrade.com prod, apisb.etrade.com
  sandbox) and resource paths are from public E*TRADE documentation.
public_code:
  - repo: https://github.com/morganstanley/api
    license: Apache-2.0
    note: >-
      Official "Morgan Stanley API Samples" repo. REST + WebSocket starter projects
      in Java, Python, and .NET (dotnet only has REST; java and python have both).
      No OpenAPI specs in-repo; each sample carries its own README. Auth samples use
      MSAL + certificate for the OAuth2 token exchange.
  - org: https://github.com/morganstanley
    note: 49 public repos; org blog at morganstanley.github.io. Broad open-source presence.
fdx_1033_aggregator_posture: >-
  No documented first-party US FDX (Financial Data Exchange) developer endpoint or a
  published CFPB 1033 open-banking data-access API was found on the public surface.
  Morgan Stanley entities (Asset Management, Bank Asia, Securities Ltd) appear in
  UK/EU Open Banking / PSD2 registries (openbankingtracker.com) as regulated ASPSPs,
  which is a compliance registration rather than a public US developer product. US
  wealth/account-aggregation access is effectively aggregator-mediated (Plaid / MX /
  Finicity / Akoya style) rather than a first-party consumer data API. Represented
  honestly: institutional access is partner-gated; retail data access is via E*TRADE's
  OAuth API for an account holder's own data.
subsidiary_note: >-
  E*TRADE is a Morgan Stanley subsidiary ("E*TRADE from Morgan Stanley"); its API is
  operated under the Morgan Stanley umbrella and is the firm's most openly accessible
  developer surface. Shareworks by Morgan Stanley (equity compensation) and Capshare
  are also cited as having native APIs but expose no public developer documentation.
findings:
  - apis_before: 1
    apis_after: 6
    specs_harvested: 0
    change: >-
      Split the single generic placeholder API into six real documented entries:
      2 institutional platform surfaces (REST, WebSocket) + 4 E*TRADE modules
      (Accounts, Market Data, Order, Alerts). Added verified common[] links
      (Website, DeveloperPortal, Documentation, TermsOfService, SampleCode,
      GitHubOrganization, LinkedIn, Blog) and corrected the top-level description
      and access model to reflect the invitation-only + public-E*TRADE reality.
