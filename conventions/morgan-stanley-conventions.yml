generated: '2026-07-23'
method: searched
source: https://apisb.etrade.com/docs/api/order/api-order-v1.html
scope: >-
  Cross-cutting request/response semantics for the public E*TRADE from Morgan
  Stanley V1 REST API. The invitation-only Morgan Stanley institutional API
  Platform follows the Microsoft API Guidelines but its specifics are gated.
authentication:
  style: oauth1
  detail: OAuth 1.0a (HMAC-SHA1), 3-legged, on behalf of an account holder.
  ref: authentication/morgan-stanley-authentication.yml
versioning:
  scheme: uri-path
  current: v1
  detail: All resource paths are prefixed with /v1 on both api.etrade.com and apisb.etrade.com.
content_negotiation:
  formats: [application/json, application/xml]
  detail: Every endpoint supports both XML and JSON request/response bodies.
idempotency:
  supported: true
  mechanism: clientOrderId
  applies_to: [Preview Order, Place Order]
  detail: >-
    On order placement the developer supplies a clientOrderId - "A reference ID
    generated by the developer that is used to ensure that a duplicate order is
    not being submitted." It must be unique within the account and be 20 or fewer
    alphanumeric characters. This is a developer-generated idempotency key that a
    network retry can reuse so it never produces a duplicate order. clientOrderId
    does not appear in API responses.
  ref: https://apisb.etrade.com/docs/api/order/api-order-v1.html
pagination:
  style: marker+count
  params:
    - name: count
      detail: Number of records to return per page (e.g. List Orders, List Transactions).
    - name: marker
      detail: Opaque marker/offset token to fetch the next page of records.
  detail: >-
    List endpoints (orders, transactions) page with a count size and a marker
    continuation token; responses carry a next marker when more records remain.
error_envelope:
  shape: >-
    Errors return an Error object with a numeric `code` and human-readable
    `message`. Numeric codes are E*TRADE-specific (not HTTP status). See error catalog.
  ref: errors/morgan-stanley-etrade-error-codes.yml
rate_limiting:
  detail: >-
    Market-data endpoints are constrained by upstream exchange redistribution
    entitlements; institutional throughput is sized per onboarding.
  ref: rate-limits/morgan-stanley-rate-limits.yml
sandbox:
  detail: Separate sandbox host (apisb.etrade.com) with its own consumer key/secret.
  ref: sandbox/morgan-stanley-sandbox.yml
